# Layer 3: an official cloud image of every supported release as a VM with
# 512 MiB inside the runner. Covers SSH from outside, a reboot, setup in tmux
# after a dropped connection and the SSH hardening for real. Runs before a
# release (push to a release/ branch), weekly, or by hand.
name: vm-run
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
  # Weekly (Sunday 03:00 Beijing time) even without changes: package updates
  # of a release can break the tool too.
  schedule:
    - cron: '0 19 * * 6'
permissions:
  contents: read
concurrency:
  group: vm-run-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        system: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5
      - name: KVM for the nested VM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo 'no KVM: the VM runs without acceleration (slow)'
      - name: QEMU, cloud-init tools and expect
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils expect openssh-client
      - name: ${{ matrix.system }} VM
        run: bash tests/ci/report.sh '${{ matrix.system }} VM' bash tests/ci/vm-run.sh ${{ matrix.system }} 512
      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vm-run-${{ matrix.system }}
          path: ${{ runner.temp }}/vps-ci-logs
          if-no-files-found: ignore
