# Layer 1: every isolated test, as root, on each supported release, plus
# ShellCheck (pinned) with no findings allowed in the script and installer.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly (Sunday 03:00 Beijing time) even without changes: package updates
  # of a release can break the tool too.
  schedule:
    - cron: '0 19 * * 6'
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck 0.11.0
        run: |
          bash tests/ci/report.sh 'ShellCheck' docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -x vps-stable-opt.sh install.sh tests/ci/*.sh
          bash tests/ci/report.sh 'ShellCheck tests' docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --severity=error tests/*.sh
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04']
    container: ${{ matrix.image }}
    steps:
      # openssh-server is never started: sshd-config-tests compares the
      # tool's reading of sshd's files with `sshd -T` of each release. Its
      # sshd is moved off PATH, so the other tests keep their mocks.
      - name: Tools the tests use
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates git openssh-client openssh-server procps iproute2 util-linux
          mkdir -p /opt/vps-test && mv /usr/sbin/sshd /opt/vps-test/sshd
      - uses: actions/checkout@v5
      - name: All isolated tests (root)
        env:
          VPS_TEST_SSHD: /opt/vps-test/sshd
        run: bash tests/ci/report.sh 'isolated tests ${{ matrix.image }}' bash tests/run-all.sh
